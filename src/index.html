<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SHOP-ENERGO</title>
    <link rel="stylesheet" href="css/app.min.css">
    <script type="module" src="js/app.min.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="header__top">
        <a class="header__brand" href="./index.html" aria-label="SHOP-ENERGO — главная страница">
          <img class="header__symbol" src="assets/images/logo-symbol.svg" width="66" height="67" alt="">
          <img class="header__wordmark" src="assets/images/logo-wordmark.svg" width="360" height="66" alt="SHOP-ENERGO.ru. Продажа бензиновых и дизельных генераторов">
        </a>
        <div class="header__info">
          <div class="header__phones">
            <p class="header__phone">
              <a class="header__phone-number" href="tel:+74998990090">+7 (499) 899-00-90</a>
              <span class="header__phone-description">Многонакальный</span>
            </p>
            <p class="header__phone">
              <a class="header__phone-number" href="tel:88007074483">8 (800) 707-44-83</a>
              <span class="header__phone-description">Бесплатный звонок по РФ</span>
            </p>
          </div>
          <span class="header__contact-divider" aria-hidden="true"></span>
          <address class="header__address">
            <p class="header__location">Москва, ул. Вавилова, д. 69/75</p>
            <img class="header__hours-divider" src="assets/images/header-hours-divider.svg" width="146" height="3" alt="">
            <p class="header__hours">с 10:00–18:00</p>
            <a class="header__email" href="mailto:shop-energo@mail.ru">shop-energo@mail.ru</a>
          </address>
          <div class="header__cart">
            <button class="header__cart-button" type="button">
              <img class="header__cart-icon" src="assets/icons/basket.svg" width="19" height="19" alt="">
              <span>КОРЗИНА</span>
            </button>
            <div class="header__cart-summary">
              <p>Товаров: 2 шт.</p>
              <p>Сумма: 80 000 ₽</p>
            </div>
            <button class="button header__callback" type="button">
              <img class="header__callback-icon" src="assets/icons/phone.svg" width="24" height="24" alt="">
              <span class="header__callback-text">
                <span class="header__callback-title">Заказать звонок</span>
                <span class="header__callback-description">перезвоним через 15 сек.</span>
              </span>
            </button>
          </div>
        </div>
      </div>
      <nav class="header__nav" aria-label="Главное меню">
        <ul class="header__nav-list">
          <li><a class="header__nav-link header__nav-link--current" href="./index.html" aria-current="page">ГЛАВНАЯ</a></li>
          <li><span class="header__nav-link">О КОМПАНИИ</span></li>
          <li><span class="header__nav-link">ОПЛАТА</span></li>
          <li><span class="header__nav-link">ДОСТАВКА</span></li>
          <li><span class="header__nav-link">ВОЗВРАТ ТОВАРА</span></li>
          <li><span class="header__nav-link">КОНТАКТЫ</span></li>
          <li><span class="header__nav-link">СПЕЦПРЕДЛОЖЕНИЯ</span></li>
        </ul>
      </nav>
    </header>
    <main class="page"></main>
  </body>
</html>
